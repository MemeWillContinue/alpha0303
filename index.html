<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PinkWallet 技术文档 - 资金费率、VA 虚拟账户、BaaS 钱包即服务">
  <title>🟣 PinkWallet 技术文档</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@3/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/custom.css">
  <link rel="stylesheet" href="assets/mobile-fix.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'PinkWallet',
      loadSidebar: true,
      loadCoverpage: true,
      coverpage: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      relativePath: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档...',
        noData: '未找到结果'
      },
      formatUpdated: false,
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@3/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script>
    (function() {
      function syncSidebarState() {
        if (window.innerWidth <= 768) {
          document.body.classList.add('close');
          return;
        }
        document.body.classList.remove('close');
      }

      syncSidebarState();
      window.addEventListener('resize', function() {
        syncSidebarState();
      });
    })();
  </script>
</body>
</html>
